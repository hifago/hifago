<h2>Tu código de verificación de Hifago</h2>
<p>Para confirmar el cambio de tu contraseña, ingresa este código en la pantalla donde lo pediste:</p>
<p style="font-size: 24px; font-weight: bold; letter-spacing: 4px;">{{ .Token }}</p>
<p>El código sirve una sola vez y vence pronto. Si no intentaste cambiar tu contraseña, ignora este correo y tu contraseña seguirá igual.</p>
