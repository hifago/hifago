<!-- Lien dynamique par app, comme confirmation.html (feature 32) : tout appelant de
     resetPasswordForEmail() (apps/admin ou apps/web) DOIT passer options.redirectTo construite via
     new URL(...).searchParams.set("next", ...) — {{ .RedirectTo }} retomberait sinon sur site_url
     SANS query string, cassant le "&token_hash=..." qui suit. apps/admin pose next=/reset-password
     (ForgotPasswordForm.tsx, déjà conforme) ; apps/web pose next=/<locale>/restablecer-password
     (ForgotPasswordForm.tsx, préfixé de la locale car /auth/callback est hors [locale]). Avant ce
     correctif, ce lien était codé en dur sur le port 3101 (admin) — cassait silencieusement tout
     reset envoyé à un compte web.
     Charte (2026-11-12) : même habillage que confirmation.html (voir son en-tête). -->
<div style="background:#f0f6fc;padding:24px 12px;font-family:Poppins,Arial,Helvetica,sans-serif;font-size:15px;line-height:1.5;color:#132f61">
<div style="max-width:600px;margin:0 auto">
<a href="https://hifago.co" style="display:block;text-decoration:none"><img src="https://hifago.co/brand/email-cabecera.jpg" width="600" alt="Hifago · Guatapé merece más de un día." style="display:block;width:100%;max-width:600px;height:auto;border:0;border-radius:16px 16px 0 0"></a>
<div style="background:#ffffff;padding:24px">
<h2 style="font-family:Anton,Impact,sans-serif;font-weight:400;font-size:30px;line-height:1.15;color:#132f61;margin:0 0 6px">Restablece tu contraseña en Hifago<span style="color:#ddae09">.</span></h2>
<p>Sigue este enlace para elegir una nueva contraseña. Vale una hora y se usa una sola vez:</p>
<p style="margin:28px 0 8px"><a href="{{ .RedirectTo }}&token_hash={{ .TokenHash }}&type=recovery" style="display:inline-block;background:#ddae09;color:#132f61;text-decoration:none;font-weight:700;font-size:16px;line-height:20px;padding:14px 24px;border-radius:8px">Restablecer contraseña</a></p>
<p style="margin:24px 0 0;color:#2a618e;font-size:13px">Si no lo pediste tú, puedes ignorar este correo — tu contraseña actual sigue siendo válida.</p>
</div>
<div style="background:#132f61;color:#ffffff;padding:18px 24px;border-radius:0 0 16px 16px;font-size:13px">
<p style="margin:0;color:#b6cde8">Hifago · Guatapé, Antioquia · <a href="https://hifago.co" style="color:#ddae09;text-decoration:underline">hifago.co</a></p>
</div>
