name: hifago-ci

on:
  push:
    branches: [main, staging]
  pull_request:
  workflow_dispatch:

# Le GITHUB_TOKEN n'a besoin que de lire le code : aucun job ici ne publie, ne commente ni ne
# pousse quoi que ce soit. Sans ce bloc, il hérite du réglage du dépôt, souvent permissif.
permissions:
  contents: read

# Deux pushs rapprochés : le run du premier est annulé plutôt que de payer une seconde stack
# Supabase pour un état de main déjà dépassé.
concurrency:
  group: hifago-ci-${{ github.ref }}
  cancel-in-progress: true

# Actions épinglées par SHA de commit (le commentaire donne la version lisible) : un tag comme
# `v4` est déplaçable, donc une action compromise en amont s'exécuterait ici sans qu'un seul
# commit ne change de ce côté.
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # ⚠️ `fetch-depth: 0` — PAS une optimisation, une correction. `actions/checkout` clone par
      # défaut à la profondeur 1, et dans un dépôt superficiel `git log -1 -- <fichier>` rend le
      # commit de TÊTE pour n'importe quel chemin : `scripts/docs_index.js` datait alors chaque
      # document du jour du push, quand l'index commité porte les vraies dates. `docs:check`
      # échouait donc à CHAQUE push, quoi qu'on corrige — 17 runs rouges d'affilée entre le
      # 2026-09-04 et le 2026-09-07 avant que quiconque regarde la CI. Le script refuse désormais
      # de tourner sur un clone superficiel plutôt que de mentir en silence.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # UNE seule étape, et c'est tout l'intérêt (revue de CI du 2026-09-19). Ce job était une
      # séquence de 13 étapes `run:` distinctes ; GitHub Actions arrête un job à la première qui
      # sort non-zéro, donc un run rouge ne révélait QU'UN défaut et masquait les autres. Trois
      # contrôles fautifs demandaient trois pushs rien que pour être découverts — cf. le commit
      # 604011d, « l'un masquant l'autre », et check-timezone.sh resté rouge six jours en masquant
      # check-tokens.sh. Mesure : 39 runs rouges sur 60, dont 15 des 20 derniers échecs ici.
      #
      # `scripts/verify.sh` lance les 12 contrôles SANS s'arrêter au premier échec et récapitule.
      # Le détail de chaque contrôle — ce qu'il porte, depuis quand, vérifié par quelle mutation —
      # a suivi le code : il est en commentaire au-dessus de chaque `lancer` dans ce script.
      #
      # C'est le MÊME script que lance le hook pre-push local (scripts/git-hooks/pre-push), en
      # ~35 s : ce qui est vert avant de pousser est vert ici.
      #
      # L'ancienne étape « Dépendances de développement — angle mort, pour information seulement »
      # (`npm audit || true`) est SUPPRIMÉE : un signal qui ne peut pas échouer n'est pas lu, et
      # celui-là avait fini par masquer trois vulnérabilités réparables (image-size, js-yaml,
      # @vitest/mocker — corrigées le 2026-09-19). L'audit de `verify` porte désormais sur tout.
      - name: Contrôles (ESLint, design system, fuseau, SEO, i18n, docs, audit)
        run: npm run verify

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck --workspaces --if-present

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test --workspaces --if-present

  # Scan de secrets sur tout l'historique, pas seulement sur le dernier diff : un secret
  # introduit puis « retiré » par un commit suivant reste extractible du dépôt. Les détections
  # déjà auditées vivent dans .gitleaksignore, à la racine.
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pas de commentaire automatique sur les PR : ça demanderait `pull-requests: write`,
          # et le compte hifago est un compte personnel, donc pas de licence à fournir.
          GITLEAKS_ENABLE_COMMENTS: false

  # Garde-fou base de données. C'est ici que tournent les 44 fichiers pgTAP, dont
  # rls_rpc_only_checklist.test.sql, qui vérifie sur TOUT le schéma public que chaque fonction
  # SECURITY DEFINER fixe search_path='', qu'aucune fonction appelée dans une policy n'est
  # VOLATILE, et que auth.uid() est toujours enveloppé.
  # ⚠️ PAS de `needs:` (revue du 2026-09-19). Ce job dépendait de [lint, typecheck, unit], si bien
  # qu'une couleur en dur dans un simulateur de paiement suffisait à SKIPPER les 62 fichiers pgTAP :
  # sur les 20 derniers runs, chaque échec de `lint` a emporté `db`, `build` et `concurrence` avec
  # lui. On ne savait donc jamais si la base était saine ni si les apps compilaient. Ces jobs sont
  # indépendants par nature — les faire dépendre l'un de l'autre n'achetait que des minutes de
  # runner, payées par la perte de toute information sur un run rouge.
  db:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # GoTrue démarre avec [auth.external.google].enabled = true : deux valeurs bidon lui
      # évitent de booter sur une configuration vide. Aucun test ici ne passe par Google.
      SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID: ci-dummy.apps.googleusercontent.com
      SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET: ci-dummy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2.1.1
        # Version figée, jamais `latest` : sinon une release de la CLI casse la CI un mardi
        # matin sans qu'aucun commit de ce dépôt n'ait bougé.
        with:
          version: 2.116.0
      # Base VIERGE ici (aucun fichier pgTAP ne référence un UUID ou un e-mail de seed.sql). La même
      # suite repasse sur base SEEDÉE à la fin du job `concurrence` : un pgTAP doit être vert sur les
      # deux, donc scoper ses comptes par ses propres fixtures, jamais compter en absolu.
      - run: supabase start
      - run: supabase test db
      # Restreint à `public` : le schéma `extensions` contient les fonctions de pgTAP
      # elles-mêmes, dont l'analyse statique remonte des erreurs qui ne sont pas les nôtres
      # (proisagg, spclocation, __tcache__ — vérifié le 2026-08-27).
      - run: supabase db lint --schema public --level error --fail-on error

  # Les 4 Edge Functions n'avaient JAMAIS été typecheckées — ni le typecheck des workspaces ni le
  # lint ne les voient (elles tournent sous Deno, hors du monorepo npm). Le premier passage a trouvé
  # un `ReturnType<typeof createClient>` qui résolvait les génériques par défaut et désactivait
  # silencieusement la vérification des arguments de deux `rpc()`.
  functions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v2.x
      # Depuis la RACINE : les fonctions importent packages/domain en chemin relatif, un check
      # lancé depuis supabase/functions ne résout pas ces modules et fabrique de fausses erreurs.
      # --node-modules-dir=auto : le runner n'a pas de node_modules (ce job ne fait pas de
      # `npm ci`), et la présence d'un package.json à la racine met Deno en mode node_modules,
      # où il refuse de résoudre npm:@supabase/supabase-js tout seul.
      - run: deno check --node-modules-dir=auto supabase/functions/*/index.ts

  # Preuve concurrente anti-survente (barrière de synchronisation, driver `pg` direct). Contrairement
  # au job `db`, celui-ci a besoin du seed : 6 des 10 tests s'appuient sur des données seedées.
  # `needs: [db]` CONSERVÉ, contrairement aux deux autres : c'est une vraie dépendance. Inutile de
  # payer une seconde stack Supabase complète si les migrations ne s'appliquent même pas.
  concurrence:
    needs: [db]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_BIN: supabase
      SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID: ci-dummy.apps.googleusercontent.com
      SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET: ci-dummy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2.1.1
        with:
          version: 2.116.0
      - run: supabase start
      # Les trois étapes ordonnées : reset sans seed, comptes auth via l'API Admin, puis seed.sql.
      - run: npm run db:setup
      - run: npm run test:concurrency
      # Suite pgTAP rejouée sur cette base SEEDÉE et déjà écrite par les tests de concurrence (audit
      # P12b, 2026-10-06). Le job `db` ne la voit que vierge, où un `count(*)` en absolu passe au
      # vert : sept fichiers comptaient ainsi et rougissaient sur toute base réelle. C'est la garde
      # mécanique de la règle « scoper par ses fixtures » (CLAUDE.md §11.20).
      - run: supabase test db

  # Tests d'intégration RÉELS des six Edge Functions de jobs (audit P12d, décision D4 du 2026-10-06 ;
  # P6 les avait laissés manuels et renvoyé leur job CI ici). Chaque script démarre sur l'hôte son
  # serveur de fixtures (LobbyPMS :4545, Resend :4546, Mercado Pago :4547) ; la fonction, servie par
  # l'edge runtime de `supabase start`, le joint par host.docker.internal. D'où deux préalables :
  # `supabase/functions/.env` écrit AVANT `start` (le runtime ne le lit qu'au démarrage), et des
  # fixtures qui écoutent sur toutes les interfaces (sous Linux, une écoute 127.0.0.1 est injoignable
  # depuis le conteneur). Base NON seedée, volontairement : les lots de ces fonctions sont globaux et
  # chaque script s'arrête (exit 2) s'il trouve des lignes hors de ses fixtures.
  # `pms_reserve_nights` n'y est pas (route web, pas une Edge Function) : D4, plus tard.
  integration-edge:
    needs: [db]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID: ci-dummy.apps.googleusercontent.com
      SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET: ci-dummy
      # Valeurs FACTICES, en UNE seule source : écrites ci-dessous dans supabase/functions/.env pour
      # les fonctions, et lues telles quelles par les scripts de test. Ceux-ci doivent connaître la
      # clé exacte de la fonction : send_notification_emails vérifie que RESEND_API_KEY ne fuit
      # nulle part (et s'arrête sans elle), la fixture Mercado Pago refuse tout autre jeton que
      # MERCADOPAGO_ACCESS_TOKEN. Les URL visent les fixtures des scripts : aucun appel ne quitte
      # la machine.
      LOBBY_API_BASE_URL: http://host.docker.internal:4545
      RESEND_API_BASE_URL: http://host.docker.internal:4546
      RESEND_API_KEY: ci-dummy-resend-key
      MERCADOPAGO_API_BASE_URL: http://host.docker.internal:4547
      MERCADOPAGO_ACCESS_TOKEN: TEST-fixture-token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2.1.1
        with:
          version: 2.116.0
      # Le runtime Edge ne lit ce fichier qu'au démarrage : écrit AVANT `supabase start`, depuis
      # l'`env:` du job ci-dessus (jamais une seconde copie des valeurs).
      - name: Secrets factices des Edge Functions (avant supabase start)
        run: |
          for v in LOBBY_API_BASE_URL RESEND_API_BASE_URL RESEND_API_KEY MERCADOPAGO_API_BASE_URL MERCADOPAGO_ACCESS_TOKEN; do
            printf '%s=%s\n' "$v" "${!v}"
          done > supabase/functions/.env
      - run: supabase start
      - run: npm run test:notification-integration
      - run: npm run test:payments-integration
      - run: |
          for f in pms_poll_bookings pms_sync_availability pms_cancel_bookings pms_nightly_contract_check; do
            node "tests/pms-integration/$f.integration.mjs" || exit 1
          done

  # Sans `needs:` lui non plus : ce job tourne sur des valeurs d'environnement FACTICES et ne touche
  # jamais la base — il n'a jamais rien eu à attendre de `db`. Il attendait pourtant `db` (101 s),
  # qui attendait `unit` (169 s) : il démarrait à 270 s alors qu'il tient en 67 s.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Valeurs FACTICES, assumées : ce job vérifie que le code compile, pas qu'il est configuré —
    # les vraies valeurs vivent dans Vercel, qui refait son propre build avec son propre
    # environnement. Sans NEXT_PUBLIC_WEB_APP_URL, apps/admin échoue à la collecte de
    # /partner/tools, qui la lit au niveau module et lève. C'est le seul throw au build des deux
    # apps (celui de mercadopago/client.ts est dans une fonction, donc paresseux).
    env:
      NEXT_PUBLIC_WEB_APP_URL: https://ci.invalid
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-dummy-anon-key
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build --workspaces --if-present

  # Étapes volontairement absentes tant que les ressources cloud n'existent pas
  # (cf. CLAUDE.md § 8 et le skill /hifago-init) : déploiement preview
  # Vercel → E2E Playwright contre le vrai déploiement preview (déclenché par
  # l'événement `deployment_status`, en-têtes de contournement de Deployment
  # Protection) → déploiement `staging` + smoke test → promotion manuelle vers
  # la prod via GitHub Environments avec approbateurs requis. À brancher une
  # fois `hifago-provision-cloud` exécuté.
